<svg width="100%" viewBox="0 0 350 350" role="img" xmlns="http://www.w3.org/2000/svg" style="">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Onway icon</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Símbolo de visor de enfoque — ícono standalone de Onway</desc>

  <rect width="340" height="340" fill="#07111a" rx="16" style="fill:rgb(7, 17, 26);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <g transform="translate(170,170)" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">

    <!-- Outer ring faint -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="rgba(228,244,240,0.05)" stroke-width="1" style="fill:none;stroke:rgba(228, 244, 240, 0.05);color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

    <!-- Main ring -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="rgba(228,244,240,0.18)" stroke-width="1.5" style="fill:none;stroke:rgba(228, 244, 240, 0.18);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

    <!-- Green accent arc — top-right -->
    <path d="M 0,-90 A 90,90 0 0 1 90,0" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" style="fill:none;stroke:rgb(52, 211, 153);color:rgb(251, 251, 254);stroke-width:4px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

    <!-- Mirror arc — bottom-left, faint -->
    <path d="M 0,90 A 90,90 0 0 1 -90,0" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" opacity="0.3" style="fill:none;stroke:rgb(52, 211, 153);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.3;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

    <!-- Crosshair — top -->
    <line x1="0" y1="-104" x2="0" y2="-28" stroke="rgba(228,244,240,0.22)" stroke-width="1" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgba(228, 244, 240, 0.22);color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <!-- bottom -->
    <line x1="0" y1="28" x2="0" y2="104" stroke="rgba(228,244,240,0.22)" stroke-width="1" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgba(228, 244, 240, 0.22);color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <!-- left -->
    <line x1="-104" y1="0" x2="-28" y2="0" stroke="rgba(228,244,240,0.22)" stroke-width="1" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgba(228, 244, 240, 0.22);color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <!-- right -->
    <line x1="28" y1="0" x2="104" y2="0" stroke="rgba(228,244,240,0.22)" stroke-width="1" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgba(228, 244, 240, 0.22);color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

    <!-- Bracket top-right — green -->
    <path d="M 34,-62 L 62,-62 L 62,-34" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="fill:none;stroke:rgb(52, 211, 153);color:rgb(251, 251, 254);stroke-width:3px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

    <!-- Bracket bottom-left — green -->
    <path d="M -34,62 L -62,62 L -62,34" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="fill:none;stroke:rgb(52, 211, 153);color:rgb(251, 251, 254);stroke-width:3px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

    <!-- Bracket top-left — faint -->
    <path d="M -34,-62 L -62,-62 L -62,-34" fill="none" stroke="rgba(228,244,240,0.18)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="fill:none;stroke:rgba(228, 244, 240, 0.18);color:rgb(251, 251, 254);stroke-width:2px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

    <!-- Bracket bottom-right — faint -->
    <path d="M 34,62 L 62,62 L 62,34" fill="none" stroke="rgba(228,244,240,0.18)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="fill:none;stroke:rgba(228, 244, 240, 0.18);color:rgb(251, 251, 254);stroke-width:2px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

    <!-- Center dot -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.5" style="fill:none;stroke:rgb(52, 211, 153);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <circle cx="0" cy="0" r="5" fill="#34d399" style="fill:rgb(52, 211, 153);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  </g>

</svg>